name: Paw Patrol dashboard checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/paw-patrol
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/paw-patrol/.nvmrc
          cache: npm
          cache-dependency-path: apps/paw-patrol/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run verify
