name: Triage checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/triage
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -m scripts.export_contracts --check
      - name: Verify live HTTP, SSE, patient scope and restart behavior
        run: uv run --no-sync python -m scripts.live_smoke
