app = "paw-patrol-hackmit"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # One machine, always on. The wall and the incident log are in this
  # process's memory: a second machine would serve a second, empty incident,
  # and a stopped machine would lose the one that exists.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
